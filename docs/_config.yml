# GitHub Pages site for BandPilot (Settings › Pages › Deploy from branch: main, folder /docs).
title: BandPilot
description: "BandPilot — free multilingual mixer app in French, English, Italian, Spanish and German. More languages on request. Windows, macOS, Linux; REAPER and personal monitors. Model-specific compatibility."
url: https://herve8940.github.io
baseurl: /BandPilot
lang: fr
author: Hervé Naessens
image: /images/bandpilot-2.2.4/expert-canal.jpg
theme: jekyll-theme-primer
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
relative_links:
  enabled: true
  collections: false
exclude:
  - CAHIER_DES_CHARGES.md
  - DEMARRAGE.md
  - RELEASE_1_0.md
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "index.html"
    values:
      layout: null
  - scope:
      path: "en.html"
    values:
      layout: null
      lang: en
  - scope:
      path: "USER_GUIDE_EN.md"
    values:
      lang: en
  - scope:
      path: "TUTO_MON_INGE_SON_EN.md"
    values:
      lang: en
  - scope:
      path: "it.html"
    values:
      layout: null
      lang: it
  - scope:
      path: "USER_GUIDE_IT.md"
    values:
      lang: it
  - scope:
      path: "TUTO_MON_INGE_SON_IT.md"
    values:
      lang: it
  - scope:
      path: "es.html"
    values:
      layout: null
      lang: es
  - scope:
      path: "USER_GUIDE_ES.md"
    values:
      lang: es
  - scope:
      path: "TUTO_MON_INGE_SON_ES.md"
    values:
      lang: es
  - scope:
      path: "de.html"
    values:
      layout: null
      lang: de
  - scope:
      path: "USER_GUIDE_DE.md"
    values:
      lang: de
  - scope:
      path: "TUTO_MON_INGE_SON_DE.md"
    values:
      lang: de

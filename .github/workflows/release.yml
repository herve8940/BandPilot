name: Release desktop installers
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      replace_version:
        description: 'Rebuild an existing release: enter its exact version (for example 2.3.1)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.version.outputs.needed }}
      replacing: ${{ steps.version.outputs.replacing }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether this version is already published
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE_VERSION: ${{ inputs.replace_version }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json,os,urllib.request,urllib.error
          version=json.load(open('package.json'))['version']
          replacement=os.environ.get('REPLACE_VERSION', '')
          if replacement and (os.environ['GITHUB_EVENT_NAME']!='workflow_dispatch' or replacement!=version):
              raise SystemExit('Replacement requires a manual run with the exact package version.')
          replacing=False
          request=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/v{version}",headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(request) as response:
                  release=json.load(response)
              replacing=bool(replacement)
              if replacing and (release.get('immutable') or release.get('draft')):
                  raise SystemExit('Cannot replace an immutable or draft release.')
              needed=replacing
              print('Explicit release rebuild requested.' if replacing else 'Version already exists; metadata-only changes do not rebuild or overwrite installers.')
          except urllib.error.HTTPError as error:
              if error.code!=404: raise
              if replacement: raise SystemExit('The requested replacement release does not exist.')
              needed=True
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('needed='+str(needed).lower()+'\n')
              output.write('replacing='+str(replacing).lower()+'\n')
          PYTHON
  package:
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-15-intel
            name: macos-intel
          - os: macos-15
            name: macos-apple-silicon
          - os: ubuntu-latest
            name: linux
    timeout-minutes: 40
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm --prefix web ci
      - name: Frontend connection regressions
        run: npm run test:web
      - name: Backend tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt || { grep -E "^not ok|^\s+(error|expected|actual|code|message):" test-output.txt | head -40 | sed 's/^/::error title=Test::/'; exit 1; }
      - run: npm run desktop:package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test installed Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/BandPilot-Windows-*.exe | Select-Object -First 1
          # Verify the actual packaged application independently of NSIS install layout.
          $unpackedExe = Join-Path (Resolve-Path 'release/win-unpacked').Path 'BandPilot.exe'
          if (-not (Test-Path $unpackedExe)) { throw 'Packaged Windows executable is missing' }
          node desktop/smoke.cjs $unpackedExe
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows application failed to start' }
          # One-click NSIS chooses its own destination. The installer may also launch
          # asynchronously; do not assume a hardcoded directory or confuse it with app startup.
          $result = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installation failed: $($result.ExitCode)" }
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs/BandPilot/BandPilot.exe'),
            (Join-Path $env:LOCALAPPDATA 'Programs/xr18-studio/BandPilot.exe'),
            (Join-Path $env:LOCALAPPDATA 'BandPilot/BandPilot.exe'),
            (Join-Path $env:ProgramFiles 'BandPilot/BandPilot.exe')
          )
          $installedExe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $installedExe) {
            Write-Host 'NSIS returned success, but the installed path was not found among known locations.'
            Write-Host 'Installed application discovery:'
            Get-ChildItem $env:LOCALAPPDATA -Filter 'BandPilot.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 10 -ExpandProperty FullName
            throw 'Installed application was not found; refusing to validate this installer'
          } else {
            node desktop/smoke.cjs $installedExe
            if ($LASTEXITCODE -ne 0) { throw 'Installed Windows application failed to start' }
          }
      - name: Test macOS disk image and launch
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          image=$(find release -maxdepth 1 -name '*.dmg' -print -quit)
          mount="$RUNNER_TEMP/xr18-dmg"
          mkdir -p "$mount"
          hdiutil attach "$image" -mountpoint "$mount" -nobrowse
          trap 'hdiutil detach "$mount"' EXIT
          node desktop/smoke.cjs "$mount/BandPilot.app/Contents/MacOS/BandPilot"
      - name: Test extracted Linux AppImage launch
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          image=$(find release -maxdepth 1 -name '*.AppImage' -print -quit)
          chmod +x "$image"
          "$image" --appimage-extract > /dev/null
          APPDIR="$PWD/squashfs-root" xvfb-run -a node desktop/smoke.cjs "$PWD/squashfs-root/AppRun"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
  publish:
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Check packages and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('installers')
          version=json.loads(pathlib.Path('package.json').read_text())['version']
          expected=[f'BandPilot-Windows-{version}.exe',f'BandPilot-macOS-{version}-x64.dmg',f'BandPilot-macOS-{version}-arm64.dmg',f'BandPilot-Linux-{version}-x86_64.AppImage',f'BandPilot-Linux-{version}-amd64.deb']
          for name in expected:
              assert (root/name).is_file(), f'Missing package: {name}'
          files=sorted(p for p in root.iterdir() if p.is_file())
          (root/'SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          PY
      - name: Back up the release before replacing its installers
        if: needs.prepare.outputs.replacing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE_VERSION: ${{ inputs.replace_version }}
        run: bash scripts/rebuild-release.sh backup
      - uses: actions/upload-artifact@v4
        if: needs.prepare.outputs.replacing == 'true'
        with:
          name: release-before-rebuild-${{ github.run_id }}
          path: release-backup/
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
      - name: Replace the explicitly requested release
        if: needs.prepare.outputs.replacing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE_VERSION: ${{ inputs.replace_version }}
        run: bash scripts/rebuild-release.sh publish
      - name: Publish version after every platform passed
        if: needs.prepare.outputs.replacing != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release already exists. Refusing to overwrite published installers."
            exit 1
          fi
          gh release create "$tag" installers/* --target "$GITHUB_SHA" --title "BandPilot $version" --notes-file docs/RELEASE_NOTES.md --draft
          # A GitHub 5xx can arrive after the edit was applied. Re-read state before retrying.
          published=false
          for attempt in 1 2 3; do
            if gh release edit "$tag" --draft=false --latest; then
              published=true
              break
            fi
            latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
            if [ "$latest" = "$tag" ]; then
              published=true
              break
            fi
            sleep 3
          done
          if [ "$published" != true ]; then
            echo "Could not confirm publication; keep the existing assets for inspection."
            exit 1
          fi

name: Desktop packages (Windows, macOS, Linux)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'web/**'
      - 'package.json'
      - '.github/workflows/desktop.yml'
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        # DEV test builds: Mac Intel only. Everything else builds all four systems.
        include: ${{ fromJSON(github.ref_name == 'DEV' && '[{"os":"macos-15-intel","name":"macos-intel"}]' || '[{"os":"windows-latest","name":"windows"},{"os":"macos-15-intel","name":"macos-intel"},{"os":"macos-15","name":"macos-apple-silicon"},{"os":"ubuntu-latest","name":"linux"}]') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend and desktop dependencies
        run: npm ci
      - name: Install frontend dependencies
        run: npm --prefix web ci
      - name: Backend tests
        shell: bash
        # Failing test names and their first error lines are raised as annotations (readable without the raw log).
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt || { grep -E "^not ok|^\s+(error|expected|actual|code|message):" test-output.txt | head -40 | sed 's/^/::error title=Test::/'; exit 1; }
      - name: Build and package desktop app
        run: npm run desktop:package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test installed Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/XR18-Studio-Windows-*.exe | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'XR18SmokeInstall'
          # NSIS oneClick installers do not support the /D custom-directory switch reliably.
          # Install in the current user profile and discover the actual installation path.
          $result = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installation failed: $($result.ExitCode)" }
          $installedExe = Join-Path $env:LOCALAPPDATA 'Programs/XR18 Studio/XR18 Studio.exe'
          if (-not (Test-Path $installedExe)) { throw "Installer exited successfully but application not found at $installedExe" }
          node desktop/smoke.cjs $installedExe
          if ($LASTEXITCODE -ne 0) { throw 'Installed Windows application failed to start' }
      - name: Upload desktop installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xr18-studio-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error


